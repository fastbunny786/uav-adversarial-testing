[project]
name = "uav-adversarial-testing"
version = "0.1.0"
description = "Adversarial testing framework for GPS-denied UAV navigation"
readme = "README.md"
authors = [
    { name = "WaqasA", email = "7456464+fastbunny786@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mavsdk>=3.15.3",
    "pandas>=3.0.3",
    "pandera>=0.31.1",
    "pyulog>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "pytest>=9.0.3",
]
