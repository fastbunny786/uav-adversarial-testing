site_name: UAV Adversarial GNSS Testing Framework
site_description: Open-source adversarial testing framework for GPS-denied UAV navigation
site_url: https://fastbunny786.github.io/uav-adversarial-testing
repo_url: https://github.com/fastbunny786/uav-adversarial-testing
repo_name: fastbunny786/uav-adversarial-testing

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Architecture Decisions:
    - ADR #001 - ROS 2 Humble: adr/001-ros2-humble.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - toc:
      permalink: true
